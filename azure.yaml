# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: skincare-agent
services:
  ai-project:
    host: azure.ai.project
  GlowSkincareAdvisor:
    host: azure.ai.agent
    project: .
    language: python
    kind: hosted
    name: GlowSkincareAdvisor
    description: Glow — Indian skincare advisor powered by Azure AI Foundry
    protocols:
      - protocol: responses
        version: 2.0.0
    startupCommand: python3 agents/stage4_foundry_hosted.py
    codeConfiguration:
      runtime: python_3_14
      entryPoint: agents/stage4_foundry_hosted.py
    uses:
      - ai-project
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_SEARCH_SERVICE_ENDPOINT: ${AZURE_AI_SEARCH_SERVICE_ENDPOINT}
      AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME: ${AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME}
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      AZURE_AI_SEARCH_API_KEY: ${AZURE_AI_SEARCH_API_KEY}
infra:
  provider: microsoft.foundry
