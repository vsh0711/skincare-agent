[project]
name = "skincare-agent"
version = "0.1.0"
description = "Glow — AI-powered Indian Skincare Advisor on Microsoft Agent Framework"
requires-python = ">=3.12"
dependencies = [
    "agent-framework",
    "agent-framework-foundry-hosting",
    "azure-identity",
    "python-dotenv",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
